name: Build cvWrap for Maya 2024

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout cvwrap with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Locate Local Maya 2024 Devkit
        shell: pwsh
        run: |
          # 直接指定并验证本地 Devkit 路径
          $devkitBase = "D:/a/_temp/devkit"
          
          if (Test-Path "$devkitBase") {
            Write-Host "成功定位本地 Maya 2024 Devkit 路径: $devkitBase"
            echo "DEVKIT_BASE=$devkitBase" >> $env:GITHUB_ENV
          } else {
            throw "未能在指定路径找到本地 Devkit: $devkitBase"
          }

      - name: Configure and Build cvWrap for Maya 2024
        shell: pwsh
        run: |
          Write-Host "Patching CMakeLists.txt for modern CMake compatibility..."
          Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-2]\..*\)', 'cmake_minimum_required(VERSION 3.16)' | Set-Content $_.FullName
          }

          $devkit = $env:DEVKIT_BASE
          Write-Host "Using Local Devkit Path: $devkit"
          
          $env:MAYA_LOCATION = $devkit
          $env:DEVKIT_LOCATION = $devkit

          $cmakeArgs = @(
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_CXX_STANDARD=17",
            "-DMAYA_VERSION=2024",
            "-DMAYA_LOCATION=$devkit",
            "-DDEVKIT_LOCATION=$devkit",
            "-DMAYA_INCLUDE_DIR=$devkit/include",
            "-DMAYA_LIBRARY=$devkit/lib/OpenMaya.lib"
          )
          
          Write-Host "Running cmake configure for Maya 2024..."
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed!"
          }

          Write-Host "Running cmake build Release..."
          & cmake --build build --config Release

      - name: Package cvWrap Plug-in and Scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/plug-ins
          New-Item -ItemType Directory -Force -Path dist/scripts

          # 精准定位 CMake 实际输出的 cvwrap.mll 路径
          $targetMll = "build/src/Release/cvwrap.mll"
          
          if (Test-Path $targetMll) {
            Write-Host "成功找到编译产物: $targetMll"
            Copy-Item $targetMll "dist/plug-ins/" -Force
          } else {
            Write-Host "指定路径未直接命中，正在全局检索 .mll 文件..."
            $mllFiles = Get-ChildItem -Path "build" -Filter "*.mll" -Recurse
            if ($mllFiles.Count -eq 0) {
              throw "未检测到编译生成的 .mll 文件，构建失败！"
            }
            foreach ($file in $mllFiles) {
              Write-Host "检索到编译产物: $($file.FullName)"
              Copy-Item $file.FullName "dist/plug-ins/" -Force
            }
          }

          if (Test-Path "scripts") {
            Write-Host "正在打包配套脚本..."
            Copy-Item -Recurse "scripts/*" "dist/scripts/" -Force
          }

      - name: Upload cvWrap Maya 2024 Package
        uses: actions/upload-artifact@v4
        with:
          name: cvWrap_Maya2024_Windows
          path: dist/
          if-no-files-found: error
