name: Build cvWrap for Maya 2022

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout cvwrap with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and Prepare Maya 2022 Devkit
        shell: pwsh
        run: |
          $urls = @(
            "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2022/Autodesk_Maya_2022_5_Update_DEVKIT_Windows.zip",
            "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2022/Autodesk_Maya_2022_DEVKIT_Windows.zip",
            "https://autodesk-adn-transfer.s3-us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2022/Autodesk_Maya_2022_DEVKIT_Windows.zip"
          )
          
          $destZip = "$env:RUNNER_TEMP\devkit.zip"
          $extractDir = "$env:RUNNER_TEMP\devkit"
          
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Attempting download from: $url"
            try {
              & curl.exe -f -L --retry 3 -o $destZip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $destZip) -and ((Get-Item $destZip).Length -gt 10000000)) {
                $fileSizeMB = [math]::Round((Get-Item $destZip).Length / 1MB, 2)
                Write-Host "Download successful! File size: $fileSizeMB MB"
                $downloaded = $true
                break
              }
            } catch {
              Write-Host "Failed from this mirror, trying next..."
            }
          }
          
          if (-not $downloaded) {
            throw "Unable to download Maya 2022 Devkit from known Autodesk endpoints."
          }
          
          Write-Host "Extracting Maya 2022 Devkit..."
          Expand-Archive -Path $destZip -DestinationPath $extractDir -Force
          
          $mfn = Get-ChildItem -Path $extractDir -Filter "MFn.h" -Recurse | Select-Object -First 1
          if ($mfn) {
            # 转换为 CMake 兼容的正斜杠格式（避免反斜杠被转义）
            $devkitBase = $mfn.Directory.Parent.Parent.FullName.Replace('\', '/')
            Write-Host "Found Maya Devkit at: $devkitBase"
            echo "DEVKIT_BASE=$devkitBase" >> $env:GITHUB_ENV
          } else {
            throw "Could not locate include/maya/MFn.h in extracted devkit!"
          }

      - name: Configure and Build cvWrap
        shell: pwsh
        run: |
          Write-Host "Patching CMakeLists.txt for modern CMake compatibility..."
          Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-2]\..*\)', 'cmake_minimum_required(VERSION 3.16)' | Set-Content $_.FullName
          }

          $devkit = $env:DEVKIT_BASE
          Write-Host "Using Clean Devkit Path: $devkit"
          
          # 设置环境变量，供 FindMaya.cmake 识别
          $env:MAYA_LOCATION = $devkit
          $env:DEVKIT_LOCATION = $devkit

          # 使用安全的参数数组调用 CMake，避免反引号换行引起的传参破坏
          $cmakeArgs = @(
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DMAYA_VERSION=2022",
            "-DMAYA_LOCATION=$devkit",
            "-DDEVKIT_LOCATION=$devkit",
            "-DMAYA_INCLUDE_DIR=$devkit/include",
            "-DMAYA_LIBRARY=$devkit/lib/OpenMaya.lib"
          )
          
          Write-Host "Running cmake configure..."
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed!"
          }

          Write-Host "Running cmake build..."
          & cmake --build build --config Release

      - name: Upload cvWrap.mll Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cvWrap_Maya2022_Windows
          path: build/**/cvWrap.mll
          if-no-files-found: error
