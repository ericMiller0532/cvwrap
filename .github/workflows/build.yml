name: Build cvWrap for Maya 2024

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout cvwrap with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download and Prepare Maya 2024 Devkit
        shell: pwsh
        run: |
          # Autodesk 官方提供的 Maya 2024 Devkit Windows 下载镜像链接
          $urls = @(
            "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2024/Autodesk_Maya_2024_2_Update_DEVKIT_Windows.zip",
            "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2024/Autodesk_Maya_2024_1_Update_DEVKIT_Windows.zip",
            "https://autodesk-adn-transfer.s3.us-west-2.amazonaws.com/ADN+Extranet/M%26E/Maya/devkit+2024/Autodesk_Maya_2024_DEVKIT_Windows.zip"
          )
          
          $destZip = "$env:RUNNER_TEMP\devkit.zip"
          $extractDir = "$env:RUNNER_TEMP\devkit"
          
          $downloaded = $false
          foreach ($url in $urls) {
            Write-Host "Attempting download from: $url"
            try {
              & curl.exe -f -L --retry 3 -o $destZip $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path $destZip) -and ((Get-Item $destZip).Length -gt 10000000)) {
                $fileSizeMB = [math]::Round((Get-Item $destZip).Length / 1MB, 2)
                Write-Host "Download successful! File size: $fileSizeMB MB"
                $downloaded = $true
                break
              }
            } catch {
              Write-Host "Failed from this mirror, trying next..."
            }
          }
          
          if (-not $downloaded) {
            throw "Unable to download Maya 2024 Devkit from known Autodesk endpoints."
          }
          
          Write-Host "Extracting Maya 2024 Devkit..."
          if (Test-Path $extractDir) { Remove-Item $extractDir -Recurse -Force }
          Expand-Archive -Path $destZip -DestinationPath $extractDir -Force
          
          # 自动递归定位 MFn.h 所在的根路径
          $mfn = Get-ChildItem -Path $extractDir -Filter "MFn.h" -Recurse | Select-Object -First 1
          if ($mfn) {
            $devkitBase = $mfn.Directory.Parent.Parent.FullName.Replace('\', '/')
            Write-Host "Found Maya 2024 Devkit at: $devkitBase"
            echo "DEVKIT_BASE=$devkitBase" >> $env:GITHUB_ENV
          } else {
            throw "Could not locate include/maya/MFn.h in extracted devkit!"
          }

      - name: Configure and Build cvWrap for Maya 2024
        shell: pwsh
        run: |
          Write-Host "Patching CMakeLists.txt for modern CMake compatibility..."
          Get-ChildItem -Path . -Filter "CMakeLists.txt" -Recurse | ForEach-Object {
            (Get-Content $_.FullName) -replace 'cmake_minimum_required\(VERSION [0-2]\..*\)', 'cmake_minimum_required(VERSION 3.16)' | Set-Content $_.FullName
          }

          $devkit = $env:DEVKIT_BASE
          Write-Host "Using Clean Devkit Path: $devkit"
          
          $env:MAYA_LOCATION = $devkit
          $env:DEVKIT_LOCATION = $devkit

          $cmakeArgs = @(
            "-B", "build",
            "-G", "Visual Studio 17 2022",
            "-A", "x64",
            "-DCMAKE_POLICY_VERSION_MINIMUM=3.5",
            "-DCMAKE_CXX_STANDARD=17",
            "-DMAYA_VERSION=2024",
            "-DMAYA_LOCATION=$devkit",
            "-DDEVKIT_LOCATION=$devkit",
            "-DMAYA_INCLUDE_DIR=$devkit/include",
            "-DMAYA_LIBRARY=$devkit/lib/OpenMaya.lib"
          )
          
          Write-Host "Running cmake configure for Maya 2024..."
          & cmake @cmakeArgs
          
          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed!"
          }

          Write-Host "Running cmake build Release..."
          & cmake --build build --config Release

      - name: Package cvWrap Plug-in and Scripts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/plug-ins
          New-Item -ItemType Directory -Force -Path dist/scripts

          # 精准定位 CMake 实际输出的 cvwrap.mll 路径
          $targetMll = "build/src/Release/cvwrap.mll"
          
          if (Test-Path $targetMll) {
            Write-Host "成功找到编译产物: $targetMll"
            Copy-Item $targetMll "dist/plug-ins/" -Force
          } else {
            Write-Host "指定路径未直接命中，正在全局检索 .mll 文件..."
            $mllFiles = Get-ChildItem -Path "build" -Filter "*.mll" -Recurse
            if ($mllFiles.Count -eq 0) {
              throw "未检测到编译生成的 .mll 文件，构建失败！"
            }
            foreach ($file in $mllFiles) {
              Write-Host "检索到编译产物: $($file.FullName)"
              Copy-Item $file.FullName "dist/plug-ins/" -Force
            }
          }

          if (Test-Path "scripts") {
            Write-Host "正在打包配套脚本..."
            Copy-Item -Recurse "scripts/*" "dist/scripts/" -Force
          }

      - name: Upload cvWrap Maya 2024 Package
        uses: actions/upload-artifact@v4
        with:
          name: cvWrap_Maya2024_Windows
          path: dist/
          if-no-files-found: error
